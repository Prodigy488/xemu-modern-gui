name: General Issue
description: Report a general issue with xemu Modern GUI, not specific to one or more particular titles
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! This template is for reporting non-title-specific issues with xemu Modern GUI, the unofficial fork in this repository (not official xemu).

        Before submitting this bug report, please check the pre-submission checklist:
        - Have you read the [README](https://github.com/Prodigy488/xemu-modern-gui#readme)?
        - Does it also happen in official [xemu](https://xemu.app)? If so, please report it to the xemu project instead.
        - Are you using the latest release of this fork?
        - Have you checked to see if this issue has already been submitted?
        - Have you tried updating your platform drivers?
        - Have you ruled out a bad dump of your game disc?
  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: |
        A brief description of the problem, including steps to reproduce the issue and any relevant screenshots of the problem.

        Tip: You can attach images by clicking this area to highlight it and then dragging files in.
      placeholder: |
        Controller force feedback no longer works after reconnecting.

        Steps to reproduce this issue:
        1. Launch xemu
        2. Connect controller (PlayStation Dual Shock 4 CUH-ZCT1U) to system
        3. Open Input dialog within xemu
        4. On Port 1, select DS4 controller
        5. Hold right trigger to activate rumble motors in input tester
        6. Right rumble motor is activated
        5. Disconnect controller from system by unplugging
        6. Reconnect, xemu automatically rebinds
        7. Hold trigger to activate rumble motors in input tester
        8. Force feedback does not work
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A brief description of the expected behavior.
      placeholder: |
        Rumble should work after reconnecting.
    validations:
      required: true
  - type: textarea
    id: xemu-version
    attributes:
      label: Version
      description: Affected xemu Modern GUI version. You can find the xemu version within xemu by navigating to <kbd>Help</kbd>&rarr;<kbd>About</kbd> (this fork shows its own version, for example 2.1). If known, include the last known-working version of xemu.
      placeholder: |
        0.0.0-00-g0000000000

        Last working in: 0.0.0-00-g0000000000
    validations:
      required: true
  - type: textarea
    id: system-information
    attributes:
      label: System Information
      description: Basic information about your system.
      placeholder: |
        OS: Windows 10
        CPU: Intel(R) Core(TM) i7-8850H CPU @ 2.60GHz
        GPU: NVIDIA Quadro P2000
        GPU Driver: 3.3.0 NVIDIA 450.119.03
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any additional information or log output.
